# Optional overlay; only include after the API and transport migrations are admitted.
# This file prepares configuration; it does not change the VM's release/startup gate.
services:
  whatsapp-bridge:
    profiles: [whatsapp]
    image: ${WHATSAPP_BRIDGE_IMAGE:?Set a verified WhatsApp bridge image digest}
    platform: linux/amd64
    user: "65532:65532"
    restart: "on-failure:5"
    stop_grace_period: 30s
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=40m,mode=1777"]
    environment:
      WABRIDGE_CONFIG_FILE: /run/secrets/whatsapp-bridge.json
      GOMEMLIMIT: 192MiB
    volumes:
      - type: bind
        source: /run/longbeach/whatsapp-bridge.json
        target: /run/secrets/whatsapp-bridge.json
        read_only: true
        bind: { create_host_path: false }
    depends_on:
      postgres: { condition: service_healthy }
    networks: [edge, database]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8091/health/live]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
