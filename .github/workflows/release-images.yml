name: Prepare release images

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: GitHub Environment que aprova e identifica a publicação
        required: true
        type: choice
        options:
          - Development
          - Test
          - Staging
          - Production

permissions:
  contents: read

concurrency:
  group: release-images-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish immutable OCI images
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.target_environment }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate environment configuration
        env:
          PUBLIC_API_URL: ${{ vars.LONG_BEACH_PUBLIC_API_URL }}
        run: |
          if [ -z "$PUBLIC_API_URL" ]; then
            echo "::error::Configure LONG_BEACH_PUBLIC_API_URL in the selected GitHub Environment."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve image names and immutable tag
        id: names
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          environment="$(printf '%s' "$TARGET_ENVIRONMENT" | tr '[:upper:]' '[:lower:]')"
          echo "api=ghcr.io/${repository}-api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${repository}-web" >> "$GITHUB_OUTPUT"
          echo "tag=${environment}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          push: true
          tags: ${{ steps.names.outputs.api }}:${{ steps.names.outputs.tag }}
          cache-from: type=gha,scope=longbeach-api
          cache-to: type=gha,mode=max,scope=longbeach-api
          provenance: true
          sbom: true

      - name: Build and publish web image
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ vars.LONG_BEACH_PUBLIC_API_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ vars.LONG_BEACH_GOOGLE_CLIENT_ID }}
            VITE_DEMO_MODE=false
            VITE_OPERATIONAL_STORAGE=postgres
          tags: ${{ steps.names.outputs.web }}:${{ steps.names.outputs.tag }}
          cache-from: type=gha,scope=longbeach-web
          cache-to: type=gha,mode=max,scope=longbeach-web
          provenance: true
          sbom: true

      - name: Record publication
        env:
          API_IMAGE: ${{ steps.names.outputs.api }}
          WEB_IMAGE: ${{ steps.names.outputs.web }}
          IMAGE_TAG: ${{ steps.names.outputs.tag }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          {
            echo "## Long Beach OS image publication"
            echo
            echo "Environment gate: ${TARGET_ENVIRONMENT}"
            echo "API: \`${API_IMAGE}:${IMAGE_TAG}\` (${API_DIGEST})"
            echo "Web: \`${WEB_IMAGE}:${IMAGE_TAG}\` (${WEB_DIGEST})"
            echo
            echo "No deployment was performed."
          } >> "$GITHUB_STEP_SUMMARY"
