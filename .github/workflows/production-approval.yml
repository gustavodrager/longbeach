name: Approve Google VM production source

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: longbeach-production-promotion
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gate
    uses: ./.github/workflows/ci.yml

  approval:
    name: Approve immutable production source
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: Production
    steps:
      - name: Validate production destination and record approval
        env:
          PUBLIC_API_URL: ${{ vars.LONG_BEACH_PUBLIC_API_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.LONG_BEACH_GOOGLE_CLIENT_ID }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$PUBLIC_API_URL" = 'https://api.longbeach.quebranunca.com.br'
          test -n "$GOOGLE_CLIENT_ID"
          {
            echo '## Approved source for Google VM production'
            echo "Source: $SOURCE_SHA"
            echo 'Quality checks passed and the Production environment approved this source.'
            echo 'The operator must still verify the OCI digest, backup, restore rehearsal and recovery plan before the controlled migration and promotion.'
            echo 'This workflow does not publish images or change hosted resources.'
          } >> "$GITHUB_STEP_SUMMARY"
