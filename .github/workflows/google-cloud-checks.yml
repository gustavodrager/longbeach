name: Google Cloud deployment checks

on:
  pull_request:
    paths:
      - deploy/google/**
      - .github/workflows/google-cloud-checks.yml
  push:
    branches: [main]
    paths:
      - deploy/google/**
      - .github/workflows/google-cloud-checks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate infrastructure without cloud credentials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      # Never reuse a developer's platform-specific provider install or a deployment backend.
      TF_DATA_DIR: ${{ runner.temp }}/longbeach-google-terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.9
          terraform_wrapper: false

      - name: Check Terraform format
        run: terraform -chdir=deploy/google/terraform fmt -check -recursive

      - name: Initialize providers without a state backend
        run: terraform -chdir=deploy/google/terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate resource definitions
        run: terraform -chdir=deploy/google/terraform validate

      - name: Verify deployment safeguards with mocked providers
        run: terraform -chdir=deploy/google/terraform test

      - name: Verify migration execution guards
        run: python3 -m unittest discover -s deploy/google/tests -p 'test_*.py'

      - name: Check shell scripts and Firebase configuration
        run: |
          while IFS= read -r script; do
            bash -n "$script"
          done < <(rg --files deploy/google -g '*.sh')
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path('deploy/google').rglob('*.json'):
              json.loads(path.read_text())
          PY
